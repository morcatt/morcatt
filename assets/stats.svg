  <text class="small" x="640" y="146">extraction templates</text>
  <rect class="card" x="878" y="2" width="400" height="186" rx="22" stroke-width="2"/>
  <text class="big mid" x="1078" y="72">ZUGFeRD</text>
  <text class="big mid" x="1078" y="118" style="font-size:30px">+ XRechnung</text>
