<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Catalin: I automate anything that repeats">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.6" stop-color="#10245C"/>
      <stop offset="1" stop-color="#1F74F5"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="360" rx="28"/></clipPath>
    <path id="flow" d="M 878 180 H 1012"/>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="1130" cy="40" r="240" fill="#FFFFFF" opacity="0.05"/>
    <circle cx="1240" cy="330" r="170" fill="#FFFFFF" opacity="0.05"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#FFFFFF" font-size="84" font-weight="700" letter-spacing="-2">Catalin</text>
    <text x="74" y="208" fill="#FFFFFF" font-size="34" font-weight="500">I automate anything that repeats.</text>
    <text x="74" y="262" fill="#B9C9F2" font-size="24">ETL developer · Founder of Morcatt Labs · Moldova</text>

    <g transform="translate(762 112)">
      <rect width="108" height="136" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
      <text x="54" y="48" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle">PDF</text>
      <rect x="20" y="68" width="68" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
      <rect x="20" y="84" width="52" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
      <rect x="20" y="100" width="68" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <use href="#flow" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" fill="none"/>
    <circle r="8" fill="#FFFFFF">
      <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    </circle>

    <g transform="translate(1020 112)">
      <rect width="188" height="136" rx="14" fill="#FFFFFF"/>
      <text x="94" y="58" fill="#10245C" font-size="30" font-weight="700" text-anchor="middle">&lt;XML/&gt;</text>
      <text x="94" y="96" fill="#1F74F5" font-size="19" font-weight="600" text-anchor="middle">clean data</text>
    </g>
  </g>
</svg>
