principles:
  - title: "Validate against the spec, not the sample."
    text: "One invoice that looks right proves nothing; the standard decides."
  - title: "Automate the second time."
    text: "If I do something twice by hand, the third time is a script. The fourth time, I forget the script exists and write a better one."
  - title: "Ship, then sharpen."
    text: "A public beta with real users teaches more than a perfect plan."

