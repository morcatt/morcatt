# What I build: one line of proof for each area.
areas:
  - { icon: "⚙️", title: Automation & data, text: "500+ extraction templates that turn documents in many languages into structured data, validated against international standards." }
  - { icon: "🤖", title: AI integrations, text: "An AI chatbot for a national telecom operator, from website integration and dialogue flows to identifying customers." }
  - { icon: "🚀", title: Products & apps, text: "Cattport, an open-source package in public beta, plus websites and web services. Mobile apps are next." }
  - { icon: "🛠️", title: Infrastructure, text: "My own server with Docker and single sign-on, a smart home, networks and camera systems I installed myself." }

# Selected work: problem, what I did, result.
stories:
  - title: An AI assistant for a national telecom operator
    when: During the pandemic
    problem: Customers kept asking the support team the same questions, at a time when everyone moved online.
    did: I integrated an AI chatbot platform into the operator's website, built the dialogue flows and connected it to customer identification, so it could recognise who is writing and offer real answers and solutions.
    result: About 1,000 conversations in its first month, real customers and test runs together. It is still answering customers today, and it has never asked for a day off.
  - title: Document data at scale
    when: 5+ years, ongoing
    problem: International companies receive invoices and business documents in every layout and language, and their systems need clean, standard-compliant data.
    did: I build extraction templates that read these documents and turn them into structured XML, then validate the result against EN 16931, ZUGFeRD and XRechnung rules with Schematron.
    result: More than 500 templates in German, Slavic languages, Chinese and more.
  - title: A product from idea to release, alone
    when: 2026
    problem: Synology users run many Docker services and keep their ports and links in bookmarks or in their heads.
    did: I designed and built Cattport, which puts those services right into the DSM main menu, with packaging, translations and documentation.
    result: Public beta, open source under GPLv3, and submitted to the SynoCommunity package catalog.

