name: Build profile

on:
  push:
    paths: [profile.yml, scripts/build.py]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git add README.md assets
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Morcatt Labs" -c user.email="119733840+morcatt@users.noreply.github.com" commit -m "Refresh profile"
          git push
